name: TradeLoom Visual Contracts

on:
  pull_request:
    paths:
      - 'app/src/**'
      - 'app/e2e/**'
      - 'app/package.json'
      - '.github/workflows/visual-contracts.yml'
  workflow_dispatch:

jobs:
  visual-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Geometry and public route checks
        run: npx playwright test -c playwright.config.js e2e/visual-geometry.spec.js e2e/visual-page-coverage.spec.js e2e/visual-auth-coverage.spec.js
      - name: Attach visual reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-contract-reports
          path: |
            app/playwright-report
            app/test-results
          if-no-files-found: ignore
