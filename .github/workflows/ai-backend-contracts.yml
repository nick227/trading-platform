name: TradeLoom AI Backend Contracts

on:
  pull_request:
    paths:
      - 'server/src/services/ai/**'
      - 'server/src/jobs/aiStrategy*.js'
      - 'server/test/**'
      - 'server/package.json'
      - 'server/prisma/**'
      - 'server/src/jobs/aiStockTrader*.js'
      - 'worker/src/broker/simulatedBroker.js'
      - 'server/src/routes/publicAiStockTrader.js'
      - 'server/src/routes/aiStrategyRoutes.js'
      - 'server/src/utils/marketCalendar.js'
      - 'server/src/loaders/routes.js'
      - '.github/workflows/ai-backend-contracts.yml'
  workflow_dispatch:

jobs:
  ai-backend-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install server dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        run: npm run db:generate --workspace=server
      - name: AI bot-definition, accounting and execution regression tests
        run: npm exec --workspace=server -- vitest run test/unit/aiStockTraderFoundation.test.js test/unit/aiStockScreener.test.js test/unit/aiStockTraderContext.test.js test/unit/aiStockTraderDecision.test.js test/unit/aiStockTraderExecution.test.js test/unit/aiStockTraderPortfolio.test.js test/unit/aiUsageGovernor.test.js test/unit/aiStockTraderDailyJob.test.js test/unit/aiStockTraderDashboard.test.js test/unit/aiStockTraderBetaSafety.test.js test/unit/aiPaperExecutionClaims.test.js test/unit/aiStockTraderAccounting.test.js test/unit/aiBotDefinitions.test.js test/integration/adminAiRoutes.test.js
